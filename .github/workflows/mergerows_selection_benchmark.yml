name: MergeRows Selection Benchmark

on:
  push:
    branches:
      - perf/mergerows-selection-vectors
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: stable
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: /tmp/mergerows-bench-target

jobs:
  benchmark:
    name: Repeated same-runner A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: amd64/rust

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust and Java
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17

      - name: Build parent and optimized benchmark binaries
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch --no-tags origin mergerows-operator-generic

          HEAD_SHA="${GITHUB_SHA}"
          BASE_SHA="$(git rev-parse origin/mergerows-operator-generic)"
          cp native/core/benches/merge_rows.rs /tmp/merge_rows.rs

          build_bench() {
            local variant="$1"
            cd native
            cargo bench -p datafusion-comet --bench merge_rows --no-default-features --no-run
            cd ..
            local bench_bin
            bench_bin="$(
              find "${CARGO_TARGET_DIR}/release/deps" -maxdepth 1 -type f -perm -111 -name 'merge_rows-*'                 -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-
            )"
            if [[ -z "${bench_bin}" ]]; then
              echo "MergeRows benchmark executable not found"
              exit 1
            fi
            cp "${bench_bin}" "/tmp/merge_rows-${variant}"
            chmod +x "/tmp/merge_rows-${variant}"
            sha256sum "/tmp/merge_rows-${variant}"
          }

          git checkout --detach "${BASE_SHA}"
          cp /tmp/merge_rows.rs native/core/benches/merge_rows.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("native/core/Cargo.toml")
          text = path.read_text()
          stanza = '\n[[bench]]\nname = "merge_rows"\nharness = false\n'
          if 'name = "merge_rows"' not in text:
              path.write_text(text + stanza)
          PY
          build_bench base

          git reset --hard
          git clean -fd
          git checkout --detach "${HEAD_SHA}"
          build_bench head

      - name: Run repeated alternating benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mergerows-results
          cd native

          capture_results() {
            local variant="$1"
            local round="$2"
            python3 - "${variant}" "${round}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          variant = sys.argv[1]
          round_number = sys.argv[2]
          root = Path(os.environ["CARGO_TARGET_DIR"]) / "criterion"
          results = {}
          for path in root.glob("**/new/estimates.json"):
              if "mergerows_clause_dispatch" not in path.as_posix():
                  continue
              key = path.parent.parent.relative_to(root).as_posix()
              data = json.loads(path.read_text())
              median = data["median"]
              results[key] = {
                  "median_ns": median["point_estimate"],
                  "median_ci_lower_ns": median["confidence_interval"]["lower_bound"],
                  "median_ci_upper_ns": median["confidence_interval"]["upper_bound"],
                  "mean_ns": data["mean"]["point_estimate"],
              }
          if not results:
              raise SystemExit(f"no MergeRows Criterion estimates found for {variant} round {round_number}")
          output = Path("/tmp/mergerows-results") / f"{variant}-{round_number}.json"
          output.write_text(json.dumps(results, indent=2, sort_keys=True))
          print(f"{variant} round {round_number}:")
          print(json.dumps(results, indent=2, sort_keys=True))
          PY
          }

          run_variant() {
            local variant="$1"
            local round="$2"
            rm -rf "${CARGO_TARGET_DIR}/criterion/mergerows_clause_dispatch"
            "/tmp/merge_rows-${variant}"               --warm-up-time 2               --measurement-time 4               --sample-size 40
            capture_results "${variant}" "${round}"
          }

          for round in 1 2 3 4; do
            if (( round % 2 == 1 )); then
              run_variant base "${round}"
              run_variant head "${round}"
            else
              run_variant head "${round}"
              run_variant base "${round}"
            fi
          done

      - name: Summarize benchmark stability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          import statistics
          from pathlib import Path

          root = Path("/tmp/mergerows-results")
          rounds = range(1, 5)
          base = {r: json.loads((root / f"base-{r}.json").read_text()) for r in rounds}
          head = {r: json.loads((root / f"head-{r}.json").read_text()) for r in rounds}

          keys = sorted(set.intersection(*(set(base[r]) & set(head[r]) for r in rounds)))
          if not keys:
              raise SystemExit("parent/head Criterion result sets do not overlap")

          def cv(values):
              if len(values) < 2:
                  return 0.0
              return statistics.stdev(values) / statistics.mean(values) * 100.0

          aggregate = {}
          suspicious = []
          lines = [
              "## MergeRows selection-vector benchmark",
              "",
              "Four base/head rounds ran on the same GitHub-hosted runner. Execution order alternated "
              "base→head / head→base to reduce warm-cache and thermal-order bias. Each Criterion run "
              "uses 2 s warm-up, 4 s measurement, and 40 samples.",
              "",
              "| Benchmark | Parent median | Optimized median | Speedup | Change | Paired speedup range | CV base/head | Stability |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: | --- |",
          ]

          for key in keys:
              base_values = [base[r][key]["median_ns"] for r in rounds]
              head_values = [head[r][key]["median_ns"] for r in rounds]
              paired = [base[r][key]["median_ns"] / head[r][key]["median_ns"] for r in rounds]

              before = statistics.median(base_values)
              after = statistics.median(head_values)
              speedup = before / after
              change = (1.0 - after / before) * 100.0
              base_cv = cv(base_values)
              head_cv = cv(head_values)

              reasons = []
              if min(paired) <= 1.0:
                  reasons.append("direction reversal")
              if base_cv > 8.0 or head_cv > 8.0:
                  reasons.append("high round variance")
              if max(paired) / min(paired) > 1.20:
                  reasons.append("wide speedup spread")
              status = "stable" if not reasons else "noisy: " + ", ".join(reasons)
              if reasons:
                  suspicious.append({"benchmark": key, "reasons": reasons})

              aggregate[key] = {
                  "base_round_medians_ns": base_values,
                  "head_round_medians_ns": head_values,
                  "base_median_ns": before,
                  "head_median_ns": after,
                  "speedup": speedup,
                  "change_percent": change,
                  "paired_speedups": paired,
                  "base_cv_percent": base_cv,
                  "head_cv_percent": head_cv,
                  "stability": status,
              }

              lines.append(
                  f"| `{key}` | {before / 1e6:.3f} ms | {after / 1e6:.3f} ms | "
                  f"{speedup:.3f}x | {change:+.1f}% | {min(paired):.3f}–{max(paired):.3f}x | "
                  f"{base_cv:.1f}% / {head_cv:.1f}% | {status} |"
              )

          lines += [
              "",
              "The reported parent/optimized values are medians of the four per-round Criterion medians. "
              "A case is flagged when a paired round reverses direction, either side exceeds 8% CV across "
              "round medians, or the paired speedup range spans more than 20%.",
          ]
          if suspicious:
              lines += [
                  "",
                  "### Cases needing caution",
                  "",
                  *[
                      f"- `{item['benchmark']}`: {', '.join(item['reasons'])}"
                      for item in suspicious
                  ],
              ]
          else:
              lines += ["", "No benchmark case crossed the noise/suspicion thresholds."]

          summary = "\n".join(lines) + "\n"
          print(summary)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary)
          Path("/tmp/benchmark-summary.md").write_text(summary)
          Path("/tmp/benchmark-aggregate.json").write_text(
              json.dumps(
                  {"benchmarks": aggregate, "suspicious": suspicious},
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: mergerows-selection-benchmark
          path: |
            /tmp/mergerows-results/*.json
            /tmp/benchmark-aggregate.json
            /tmp/benchmark-summary.md
          if-no-files-found: error
