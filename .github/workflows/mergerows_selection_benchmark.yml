name: MergeRows Selection Benchmark

on:
  push:
    branches:
      - perf/mergerows-selection-vectors
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: stable
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: /tmp/mergerows-bench-target

jobs:
  benchmark-base:
    name: Parent implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: amd64/rust

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust and Java
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17

      - name: Prepare parent benchmark
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch --no-tags origin mergerows-operator-generic
          cp native/core/benches/merge_rows.rs /tmp/merge_rows.rs
          BASE_SHA="$(git rev-parse origin/mergerows-operator-generic)"
          git checkout --detach "${BASE_SHA}"
          cp /tmp/merge_rows.rs native/core/benches/merge_rows.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("native/core/Cargo.toml")
          text = path.read_text()
          stanza = '\n[[bench]]\nname = "merge_rows"\nharness = false\n'
          if 'name = "merge_rows"' not in text:
              path.write_text(text + stanza)
          PY

      - name: Benchmark parent implementation
        shell: bash
        run: |
          set -euo pipefail
          cd native
          cargo bench -p datafusion-comet --bench merge_rows --no-default-features --             --warm-up-time 1 --measurement-time 3 --sample-size 20
          cd ..
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CARGO_TARGET_DIR"]) / "criterion"
          results = {}
          for path in root.glob("**/new/estimates.json"):
              if "mergerows_clause_dispatch" not in path.as_posix():
                  continue
              key = path.parent.parent.relative_to(root).as_posix()
              data = json.loads(path.read_text())
              results[key] = {
                  "median_ns": data["median"]["point_estimate"],
                  "mean_ns": data["mean"]["point_estimate"],
              }
          if not results:
              raise SystemExit("no MergeRows Criterion estimates found for parent")
          Path("/tmp/base-results.json").write_text(json.dumps(results, indent=2, sort_keys=True))
          print(json.dumps(results, indent=2, sort_keys=True))
          PY

      - name: Upload parent results
        uses: actions/upload-artifact@v6
        with:
          name: mergerows-selection-base
          path: /tmp/base-results.json
          if-no-files-found: error

  benchmark-head:
    name: Optimized implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: amd64/rust

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust and Java
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.RUST_VERSION }}
          jdk-version: 17

      - name: Benchmark optimized implementation
        shell: bash
        run: |
          set -euo pipefail
          cd native
          cargo bench -p datafusion-comet --bench merge_rows --no-default-features --             --warm-up-time 1 --measurement-time 3 --sample-size 20
          cd ..
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CARGO_TARGET_DIR"]) / "criterion"
          results = {}
          for path in root.glob("**/new/estimates.json"):
              if "mergerows_clause_dispatch" not in path.as_posix():
                  continue
              key = path.parent.parent.relative_to(root).as_posix()
              data = json.loads(path.read_text())
              results[key] = {
                  "median_ns": data["median"]["point_estimate"],
                  "mean_ns": data["mean"]["point_estimate"],
              }
          if not results:
              raise SystemExit("no MergeRows Criterion estimates found for optimized head")
          Path("/tmp/head-results.json").write_text(json.dumps(results, indent=2, sort_keys=True))
          print(json.dumps(results, indent=2, sort_keys=True))
          PY

      - name: Upload optimized results
        uses: actions/upload-artifact@v6
        with:
          name: mergerows-selection-head
          path: /tmp/head-results.json
          if-no-files-found: error

  compare:
    name: Compare results
    needs:
      - benchmark-base
      - benchmark-head
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Download parent results
        uses: actions/download-artifact@v7
        with:
          name: mergerows-selection-base
          path: benchmark-results/base

      - name: Download optimized results
        uses: actions/download-artifact@v7
        with:
          name: mergerows-selection-head
          path: benchmark-results/head

      - name: Compare benchmark results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          base = json.loads(Path("benchmark-results/base/base-results.json").read_text())
          head = json.loads(Path("benchmark-results/head/head-results.json").read_text())
          keys = sorted(set(base) & set(head))
          if not keys:
              raise SystemExit("parent/head Criterion result sets do not overlap")

          lines = [
              "## MergeRows selection-vector benchmark",
              "",
              "| Benchmark | Parent median | Optimized median | Speedup | Change |",
              "| --- | ---: | ---: | ---: | ---: |",
          ]
          for key in keys:
              before = base[key]["median_ns"]
              after = head[key]["median_ns"]
              speedup = before / after
              change = (1.0 - after / before) * 100.0
              lines.append(
                  f"| `{key}` | {before / 1e6:.3f} ms | {after / 1e6:.3f} ms | "
                  f"{speedup:.3f}x | {change:+.1f}% |"
              )

          lines += [
              "",
              "Parent and optimized variants ran in parallel on separate GitHub-hosted runners "
              "with the same Criterion harness and benchmark settings.",
          ]
          summary = "\n".join(lines) + "\n"
          print(summary)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary)
          Path("benchmark-summary.md").write_text(summary)
          PY

      - name: Upload benchmark summary
        uses: actions/upload-artifact@v6
        with:
          name: mergerows-selection-benchmark
          path: |
            benchmark-results/base/base-results.json
            benchmark-results/head/head-results.json
            benchmark-summary.md
          if-no-files-found: error
