name: Fork Iceberg Code Before After Benchmark

on:
  push:
    branches: [feat/iceberg-adaptive-benchmark]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-iceberg-code-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-Clink-arg=-fuse-ld=bfd"
  RUST_BACKTRACE: "1"

jobs:
  native:
    if: github.repository == 'unikdahal/datafusion-comet'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: amd64/rust
    strategy:
      fail-fast: false
      matrix:
        variant: [before]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ matrix.variant == 'before' && '569eaa59d032f758669777964aee2d24eb55ebae' || github.sha }}
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - name: Mark checkout safe for build helpers
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-runtime-registry-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: Linux-cargo-ci-
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: benchmark-harness
      - name: Find the exact original baseline release library
        id: baseline
        working-directory: benchmark-harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/benchmark-harness"
          python3 dev/ci/reuse-iceberg-baseline-library.py
      - uses: actions/download-artifact@v8
        if: steps.baseline.outputs.artifact_id != ''
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact_id }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Verify the reused baseline revision
        if: steps.baseline.outputs.artifact_id != ''
        run: test "$(cat code-revision.txt)" = '569eaa59d032f758669777964aee2d24eb55ebae'
      - name: Find an identical patched release library
        if: matrix.variant == 'after'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev/ci/reuse-iceberg-runtime-library.py
      - uses: actions/download-artifact@v8
        if: steps.reuse.outputs.artifact_id != ''
        with:
          artifact-ids: ${{ steps.reuse.outputs.artifact_id }}
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
          path: native/target/release
      - name: Record the exact code revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD > code-revision.txt
      - name: Build the exact code revision
        if: steps.reuse.outputs.artifact_id == '' && steps.baseline.outputs.artifact_id == ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd native && cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: code-benchmark-native-${{ matrix.variant }}
          path: |
            native/target/release/libcomet.so
            code-revision.txt
  patched:
    needs: native
    if: github.repository == 'unikdahal/datafusion-comet'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: amd64/rust
    strategy:
      fail-fast: false
      matrix:
        variant: [after]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ matrix.variant == 'before' && '569eaa59d032f758669777964aee2d24eb55ebae' || github.sha }}
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - name: Mark checkout safe for build helpers
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-runtime-registry-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: Linux-cargo-ci-
      - name: Find an identical patched release library
        if: matrix.variant == 'after'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev/ci/reuse-iceberg-runtime-library.py
      - uses: actions/download-artifact@v8
        if: steps.reuse.outputs.artifact_id != ''
        with:
          artifact-ids: ${{ steps.reuse.outputs.artifact_id }}
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
          path: native/target/release
      - name: Record the exact code revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD > code-revision.txt
      - name: Build the exact code revision
        if: steps.reuse.outputs.artifact_id == ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd native && cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: code-benchmark-native-${{ matrix.variant }}
          path: |
            native/target/release/libcomet.so
            code-revision.txt
  benchmark:
    needs: [native, patched]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: amd64/rust
    env:
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
      COMET_CODE_BENCHMARK_ROWS: '4000000'
      COMET_CODE_BENCHMARK_PAYLOAD_REPEATS: '4'
      COMET_CODE_BENCHMARK_ROW_GROUP_BYTES: '8388608'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - uses: actions/download-artifact@v8
        with:
          pattern: code-benchmark-native-*
          path: code-libraries
      - name: Mark checkout safe for build helpers
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: runtime-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: Linux-java-maven-
      - name: Measure exact before and after code against the same persisted file
        run: |
          export SPARK_HOME="$GITHUB_WORKSPACE"
          export COMET_CODE_BENCHMARK_WAREHOUSE="$RUNNER_TEMP/code-benchmark-warehouse"
          export COMET_CODE_BENCHMARK_OUTPUT="$GITHUB_WORKSPACE/code-benchmark.jsonl"
          mkdir -p native/target/release
          for iteration in 0 1 2 3 4; do
            export COMET_CODE_BENCHMARK_ITERATION="$iteration"
            if [ $((iteration % 2)) -eq 0 ]; then variants="before after"; else variants="after before"; fi
            for variant in $variants; do
              export COMET_CODE_BENCHMARK_VARIANT="$variant"
              export COMET_CODE_BENCHMARK_REVISION="$(cat code-libraries/code-benchmark-native-$variant/code-revision.txt)"
              cp code-libraries/code-benchmark-native-$variant/native/target/release/libcomet.so native/target/release/libcomet.so
              ./mvnw -B -Prelease -Pspark-4.1 test -Dtest=none \
                '-Dsuites=org.apache.comet.CometIcebergNativeSuite true code before after native Iceberg benchmark'
            done
          done
          python3 dev/ci/summarize-iceberg-code-benchmark.py code-benchmark.jsonl > code-benchmark.md
          cat code-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iceberg-true-code-benchmark
          path: |
            code-benchmark.jsonl
            code-benchmark.md
            **/target/surefire-reports/*
            **/target/unit-tests.log
