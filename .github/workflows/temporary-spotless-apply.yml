name: Temporary Spotless apply

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  apply:
    if: github.event.label.name == 'run-all-spark-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Apply Spotless with the Spark 4.1 profile
        run: ./mvnw -B -Pspark-4.1 spotless:apply

      - name: Export formatter patch
        run: git diff --binary > /tmp/spotless.patch

      - uses: actions/upload-artifact@v4
        with:
          name: temporary-spotless-patch
          path: /tmp/spotless.patch
          if-no-files-found: error
