name: MergeRows sync validation

on:
  push:
    branches:
      - merge-rows-sync-executor

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Sync and validate
        run: bash dev/merge_rows_sync.sh
