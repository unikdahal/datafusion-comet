name: Fork Hardening Format Artifacts

on:
  push:
    branches: ['adaptive-ci/runtime-pruning-final']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'unikdahal/datafusion-comet'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Record formatting patch
        run: |
          cd native && cargo fmt --all
          cd ..
          npx --yes prettier --write docs/runtime-pruning-design.md benchmarks/iceberg-runtime-pruning/README.md .github/workflows/fork_hardening_format.yml
          git diff > hardening-format.patch
      - uses: actions/upload-artifact@v7
        with:
          name: hardening-format
          path: hardening-format.patch
      - name: Require formatted sources
        run: test ! -s hardening-format.patch
