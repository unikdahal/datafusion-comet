name: MergeRows cardinality design benchmark

on:
  push:
    branches:
      - bench/mergerows-cardinality-designs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: mergerows-design-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run design benchmark
        working-directory: native
        run: |
          set -o pipefail
          cargo bench -p datafusion-comet --bench mergerows_cardinality_designs --no-default-features 2>&1 | tee mergerows-design.txt
          cargo bench -p datafusion-comet --bench mergerows_cardinality_adaptive --no-default-features 2>&1 | tee mergerows-adaptive.txt
          cargo bench -p datafusion-comet --bench mergerows_cardinality_scaling --no-default-features 2>&1 | tee mergerows-scaling.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mergerows-cardinality-design-results
          path: |
              native/mergerows-design.txt
              native/mergerows-adaptive.txt
              native/mergerows-scaling.txt
