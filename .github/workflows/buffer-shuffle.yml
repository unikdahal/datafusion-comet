name: Buffer shuffle validation
on:
  push:
    branches: [feature/async-buffer-shuffle]
  workflow_dispatch:
    inputs:
      celeborn_repository:
        description: Repository containing the buffer API client
        type: string
        default: apache/celeborn
      celeborn_ref:
        description: Exact companion client commit or release
        type: string
        default: main
permissions:
  contents: read
env:
  RUSTFLAGS: '-Ctarget-cpu=x86-64-v3 -Clink-arg=-fuse-ld=bfd'
  SPARK_LOCAL_IP: 127.0.0.1
  SPARK_LOCAL_HOSTNAME: localhost
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: |
          python -m py_compile dev/ci/celeborn_buffer_integration.py dev/ci/celeborn_buffer_report.py
          (cd native && cargo fmt --all)
          ./mvnw -B -Pspark-3.5,scala-2.12 spotless:apply
          git diff > formatting.patch
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-formatting
          path: formatting.patch
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format source and compile JVM exception classes
        run: |
          (cd native && cargo fmt --all)
          ./mvnw -B -ntp spotless:apply
          git diff > formatting.patch
          git diff --exit-code
          ./mvnw -B -ntp -DskipTests compile
      - name: Native shuffle and JNI contract tests
        run: |
          export LD_LIBRARY_PATH="$JAVA_HOME/lib/server:${LD_LIBRARY_PATH:-}"
          cd native
          cargo test --profile ci -p datafusion-comet-shuffle -p datafusion-comet-jni-bridge 2>&1 | tee ../native-tests.log
          cargo build --profile ci
          cargo clippy --profile ci -p datafusion-comet-shuffle -p datafusion-comet-jni-bridge --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: native-library
          path: native/target/ci/libcomet.so
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-contract-and-formatting
          path: |
            formatting.patch
            native-tests.log
  native-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-buffer-release-debug0-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build production native library
        run: |
          ./mvnw -B -ntp spotless:apply
          git diff --exit-code
          ./mvnw -B -ntp -DskipTests compile
          cd native
          cargo build --release -j 2
          git rev-parse HEAD > target/release/native-build.txt
          cargo --version >> target/release/native-build.txt
          sha256sum target/release/libcomet.so >> target/release/native-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-library
          path: |
            native/target/release/libcomet.so
            native/target/release/native-build.txt
  spark:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: ['spark-3.5,scala-2.12', 'spark-4.0,scala-2.13', 'spark-4.1,scala-2.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: native-library
          path: native/target/release
      - name: Celeborn and both shuffle implementations
        run: |
          ./mvnw -B -P${{ matrix.profile }} spotless:apply
          SPARK_HOME="$PWD" ./mvnw -B -P${{ matrix.profile }} -Prelease test \
            -Dtest=none -Dsuites=org.apache.comet.shuffle.CelebornShufflePartitionPusherSuite,org.apache.spark.sql.comet.execution.shuffle.CometCelebornNativeShuffleWriterSuite,org.apache.spark.sql.comet.execution.shuffle.CometCelebornShuffleReaderSuite,org.apache.spark.sql.comet.execution.shuffle.CometCelebornShuffleManagerSuite,org.apache.spark.sql.comet.execution.shuffle.CometCelebornShuffleFallbackSuite,org.apache.spark.sql.comet.execution.shuffle.CometCelebornShufflePlanningSuite,org.apache.spark.sql.comet.execution.shuffle.CometCelebornConcurrentMaterializationSuite,org.apache.spark.sql.comet.execution.shuffle.CometCelebornShuffleStatisticsSuite,org.apache.spark.sql.comet.execution.shuffle.CometCelebornLocalFetchFailureSuite,org.apache.comet.exec.CometNativeShuffleSuite,org.apache.comet.exec.CometShuffleSuite,org.apache.comet.exec.DisableAQECometShuffleSuite,org.apache.comet.exec.CometShuffleEncryptionSuite,org.apache.comet.exec.CometShuffleManagerSuite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-${{ matrix.profile }}
          path: |
            **/target/surefire-reports/**
            **/target/test-reports/**
            **/target/*.txt
            **/target/unit-tests.log
            **/hs_err_pid*.log
  released-client:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ['0.6.0', '0.7.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: native-library
          path: native/target/release
      - name: Check public contract against released clients
        run: |
          ./mvnw -B -Pspark-3.5,scala-2.12 spotless:apply
          SPARK_HOME="$PWD" ./mvnw -B -ntp -Prelease \
            -Pspark-3.5,scala-2.12,celeborn-reflection-compatibility test \
            -Dceleborn.version=${{ matrix.version }} -Dtest=none \
            -Dsuites=org.apache.comet.shuffle.CelebornReflectionCompatibilitySuite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-client-${{ matrix.version }}
          path: |
            **/target/surefire-reports/**
            **/target/test-reports/**
  integration:
    needs: native-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replicate: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: native-release-library
          path: native/target/release
      - name: Record benchmark environment
        run: |
          mkdir -p /tmp/shuffle-results
          cp native/target/release/native-build.txt /tmp/shuffle-results/native-build.txt
          lscpu > /tmp/shuffle-results/hardware.txt
          java -version 2> /tmp/shuffle-results/java.txt
      - name: Build Comet and install Spark 3.5.9 runtime
        run: |
          python -m pip install pyspark==3.5.9
          SPARK_HOME=$(python -c 'import os, pyspark; print(os.path.dirname(pyspark.__file__))')
          echo "SPARK_HOME=$SPARK_HOME" >> "$GITHUB_ENV"
          ./mvnw -B -ntp -Pspark-3.5,scala-2.12 spotless:apply
          ./mvnw -B -ntp -Pspark-3.5,scala-2.12 -Prelease package -DskipTests
          COMET_JAR=$(find "$PWD/spark/target" -maxdepth 1 -name 'comet-spark-spark3.5_2.12-*.jar' ! -name '*tests*' ! -name '*sources*' | head -1)
          echo "COMET_JAR=$COMET_JAR" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.celeborn_repository || format('{0}/celeborn', github.repository_owner) }}
          ref: ${{ inputs.celeborn_ref || github.ref_name }}
          path: celeborn
      - name: Build Celeborn master, worker and matching client
        run: |
          cd celeborn
          build/make-distribution.sh -Pspark-3.5
          CELEBORN_JAR=$(find "$PWD/dist/spark" -name 'celeborn-client-spark-3-shaded_2.12-*.jar' | head -1)
          echo "CELEBORN_JAR=$CELEBORN_JAR" >> "$GITHUB_ENV"
      - name: Start real master and worker
        run: |
          mkdir -p /tmp/celeborn-worker/one /tmp/celeborn-worker/two /tmp/shuffle-results
          cat > celeborn/dist/conf/celeborn-defaults.conf <<'EOF'
          celeborn.master.host 127.0.0.1
          celeborn.master.port 9097
          celeborn.master.endpoints 127.0.0.1:9097
          celeborn.metrics.enabled false
          celeborn.worker.storage.dirs /tmp/celeborn-worker/one:disktype=SSD
          celeborn.worker.monitor.disk.enabled false
          EOF
          celeborn/dist/sbin/start-master.sh
          CELEBORN_WORKER_MEMORY=512m CELEBORN_WORKER_OFFHEAP_MEMORY=512m WORKER_INSTANCE=1 \
            celeborn/dist/sbin/start-worker.sh
          sed 's@/tmp/celeborn-worker/one@/tmp/celeborn-worker/two@' \
            celeborn/dist/conf/celeborn-defaults.conf > /tmp/worker-two.conf
          echo 'celeborn.worker.http.port 9095' >> /tmp/worker-two.conf
          CELEBORN_WORKER_MEMORY=512m CELEBORN_WORKER_OFFHEAP_MEMORY=512m WORKER_INSTANCE=2 \
            celeborn/dist/sbin/start-worker.sh --properties-file /tmp/worker-two.conf
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9097) >/dev/null 2>&1; then break; fi
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/9097) >/dev/null 2>&1
          sleep 5
      - name: Prepare deterministic data and Spark baseline
        run: |
          "$SPARK_HOME/bin/spark-submit" --master 'local[4]' \
            dev/ci/celeborn_buffer_integration.py --mode prepare --data /tmp/shuffle-data --output /tmp/unused
          "$SPARK_HOME/bin/spark-submit" --master 'local[4]' \
            --conf spark.sql.adaptive.enabled=false --conf spark.sql.autoBroadcastJoinThreshold=-1 \
            dev/ci/celeborn_buffer_integration.py --mode baseline --data /tmp/shuffle-data --output /tmp/shuffle-results/baseline.json
      - name: Compare native heap and native direct modes
        run: |
          for mode in heap direct; do
            direct=false
            if [ "$mode" = direct ]; then direct=true; fi
            /usr/bin/time -v -o "/tmp/shuffle-results/$mode.resources.txt" \
            "$SPARK_HOME/bin/spark-submit" --master 'local[4]' \
              --jars "$COMET_JAR,$CELEBORN_JAR" --driver-class-path "$COMET_JAR:$CELEBORN_JAR" \
              --conf "spark.executor.extraClassPath=$COMET_JAR:$CELEBORN_JAR" \
              --conf spark.plugins=org.apache.spark.CometPlugin \
              --conf spark.shuffle.manager=org.apache.spark.sql.comet.execution.shuffle.CometCelebornShuffleManager \
              --conf spark.serializer=org.apache.spark.serializer.KryoSerializer \
              --conf spark.celeborn.master.endpoints=127.0.0.1:9097 \
              --conf spark.celeborn.client.spark.stageRerun.enabled=true \
              --conf spark.celeborn.client.spark.shuffle.fallback.policy=NEVER \
              --conf spark.celeborn.client.shuffle.integrityCheck.enabled=true \
              --conf spark.celeborn.client.push.replicate.enabled=${{ matrix.replicate }} \
              --conf spark.shuffle.service.enabled=false \
              --conf spark.comet.exec.enabled=true --conf spark.comet.shuffle.enabled=true \
              --conf spark.comet.shuffle.mode=native \
              --conf "spark.comet.shuffle.celeborn.directBuffer.enabled=$direct" \
              --conf spark.comet.shuffle.rss.maxFrameBytes=8m \
              --conf spark.comet.shuffle.rss.maxInFlightBytes=64m \
              --conf spark.memory.offHeap.enabled=true --conf spark.memory.offHeap.size=1g \
              --conf spark.sql.adaptive.enabled=false --conf spark.sql.autoBroadcastJoinThreshold=-1 \
              dev/ci/celeborn_buffer_integration.py --mode "$mode" --data /tmp/shuffle-data \
                --output "/tmp/shuffle-results/$mode.json" 2>&1 | tee "/tmp/shuffle-results/$mode.log"
          done
      - name: Prove parity and service storage
        run: |
          python - <<'EOF'
          import json
          root = '/tmp/shuffle-results/'
          results = {mode: json.load(open(root+mode+'.json')) for mode in ['baseline','heap','direct']}
          for name, reference in results['baseline'].items():
              for mode in ['heap','direct']:
                  actual=results[mode][name]
                  assert actual['sha256'] == reference['sha256'] and actual['rows'] == reference['rows'], (mode,name)
          print('PARITY_OK', json.dumps(results, sort_keys=True))
          EOF
          ! rg 'Fallback to vanilla Spark SortShuffleManager|requires the public caller-owned' /tmp/shuffle-results/heap.log /tmp/shuffle-results/direct.log
          find /tmp/celeborn-worker -type f -printf '%p %s bytes\n' > /tmp/shuffle-results/worker-files.txt
          test -s /tmp/shuffle-results/heap.json.worker-native-frames.json
          test -s /tmp/shuffle-results/direct.json.worker-native-frames.json
          git rev-parse HEAD > /tmp/shuffle-results/comet-sha.txt
          git -C celeborn rev-parse HEAD > /tmp/shuffle-results/celeborn-sha.txt
      - name: Stop services
        if: always()
        run: |
          WORKER_INSTANCE=1 celeborn/dist/sbin/stop-worker.sh || true
          WORKER_INSTANCE=2 celeborn/dist/sbin/stop-worker.sh || true
          celeborn/dist/sbin/stop-master.sh || true
      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p /tmp/shuffle-results
          if [ -d celeborn/dist/logs ]; then
            cp -r celeborn/dist/logs /tmp/shuffle-results/celeborn-logs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-cluster-replicate-${{ matrix.replicate }}
          path: /tmp/shuffle-results/**
  evidence:
    needs: [format, native, native-release, spark, released-client, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: evidence-input
      - name: Summarize verified parity and measured queries
        run: |
          python dev/ci/celeborn_buffer_report.py --artifacts evidence-input --output evidence-report
          cat evidence-report/evidence.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-report
          path: evidence-report/**
