# Fork-only matched benchmark of adaptive native Iceberg pruning. The branch and
# latest Apache main, resolved once per run, are built with identical commands and run on
# one runner against the same generated tables. See
# benchmarks/iceberg-runtime-pruning/README.md.

name: Fork Adaptive Iceberg Pruning Benchmark

on:
  push:
    branches: ['adaptive-bench/**']

permissions:
  contents: read

concurrency:
  group: fork-iceberg-adaptive-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-Clink-arg=-fuse-ld=bfd"

jobs:
  resolve:
    if: github.repository == 'unikdahal/datafusion-comet'
    runs-on: ubuntu-24.04
    outputs:
      main: ${{ steps.revisions.outputs.main }}
      branch: ${{ steps.revisions.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve latest Apache main once for this run
        id: revisions
        run: |
          git fetch --no-tags https://github.com/apache/datafusion-comet.git refs/heads/main
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          git = lambda *args: subprocess.check_output(["git", *args], text=True).strip()
          revisions = {"main": git("rev-parse", "FETCH_HEAD^{commit}"),
                       "branch": git("rev-parse", "HEAD"),
                       "repository": "https://github.com/apache/datafusion-comet.git",
                       "ref": "refs/heads/main",
                       "resolved_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path("resolved").mkdir()
          pathlib.Path("resolved/revisions.json").write_text(json.dumps(revisions, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for side in ("main", "branch"):
                  out.write(f"{side}={revisions[side]}\n")
          print(json.dumps(revisions, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: resolved-revisions
          path: resolved/revisions.json
          if-no-files-found: error

  build:
    needs: resolve
    if: github.repository == 'unikdahal/datafusion-comet'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: amd64/rust
    strategy:
      matrix:
        side: [main, branch]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select the immutable commit resolved for this run
        id: commit
        env:
          COMET_REVISION: ${{ matrix.side == 'main' && needs.resolve.outputs.main || needs.resolve.outputs.branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ matrix.side }}" = main ]; then
            git fetch --no-tags https://github.com/apache/datafusion-comet.git "$COMET_REVISION"
          fi
          git checkout --detach "$COMET_REVISION"
          test "$(git rev-parse HEAD)" = "$COMET_REVISION"
          echo "sha=$COMET_REVISION" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - name: Build the release library and Spark 3.5 jar
        env:
          COMET_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          cd native && cargo build --release --locked && cd ..
          ./mvnw -B install -Prelease -DskipTests -Pspark-3.5
          # Written after the Maven build so the license check never sees it.
          mkdir -p dist
          echo "$COMET_COMMIT" > dist/comet-commit.txt
          for jar in spark/target/comet-spark-spark3.5_2.12-*.jar; do
            case "$jar" in
              *-sources.jar|*-tests.jar|*/original-*) ;;
              *) cp "$jar" dist/comet.jar ;;
            esac
          done
          test -s dist/comet.jar
          sha256sum dist/comet.jar
      - uses: actions/upload-artifact@v7
        with:
          name: comet-${{ matrix.side }}
          path: dist

  benchmark:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BENCH_ROWS: '16000000'
      BENCH_FILES: '16'
      BENCH_ROUNDS: '6'
      BENCH_REPS: '3'
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Each matrix build lands in jars/comet-main and jars/comet-branch.
      - uses: actions/download-artifact@v8
        with:
          pattern: comet-*
          path: jars
      - name: Install Spark 3.5.9 and Iceberg 1.8.1
        run: |
          python3 -m pip install --user --break-system-packages pyspark==3.5.9
          curl -fsSL -o jars/iceberg.jar \
            https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.8.1/iceberg-spark-runtime-3.5_2.12-1.8.1.jar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: resolved-revisions
          path: resolved
      - name: Record the environment
        run: |
          {
            echo "## Environment"
            cat resolved/revisions.json
            echo
            echo "- main commit: \`$(cat jars/comet-main/comet-commit.txt)\`"
            echo "- branch commit: \`$(cat jars/comet-branch/comet-commit.txt)\`"
            echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) vCPUs"
            echo "- memory: $(free -g | awk '/Mem:/ {print $2}') GiB"
            echo "- Spark 3.5.9, Iceberg 1.8.1, Java $(java -version 2>&1 | head -1)"
            echo "- rows: $BENCH_ROWS in $BENCH_FILES files per table; rounds: $BENCH_ROUNDS; reps per round: $BENCH_REPS"
            echo
          } > environment.md
          sha256sum jars/*/comet.jar jars/iceberg.jar
      - name: Generate tables once with plain Spark
        run: |
          export WAREHOUSE="$RUNNER_TEMP/warehouse"
          spark-submit --master 'local[4]' --driver-memory 8g --jars jars/iceberg.jar \
            --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
            --conf spark.sql.catalog.bench=org.apache.iceberg.spark.SparkCatalog \
            --conf spark.sql.catalog.bench.type=hadoop \
            --conf "spark.sql.catalog.bench.warehouse=$WAREHOUSE" \
            --conf spark.ui.enabled=false \
            benchmarks/iceberg-runtime-pruning/generate_data.py | tee generate.log
          { echo "## Tables"; echo; grep '^TABLE' generate.log | sed 's/^/- /'; echo; } >> environment.md
      - name: Run rounds in rotated variant order
        run: |
          export WAREHOUSE="$RUNNER_TEMP/warehouse"
          export BENCH_OUTPUT="$GITHUB_WORKSPACE/results.jsonl"
          filters() {
            for key in join.dynamicFilter.enabled topK.fusion.enabled \
                topK.dynamicFilter.enabled aggregate.dynamicFilter.enabled; do
              echo "--conf spark.comet.exec.$key=$1"
            done
          }
          variants=(main off on)
          for round in $(seq 0 $((BENCH_ROUNDS - 1))); do
            for offset in 0 1 2; do
              variant="${variants[$(((round + offset) % 3))]}"
              case "$variant" in
                main) jar=jars/comet-main/comet.jar; enabled=true ;;
                off) jar=jars/comet-branch/comet.jar; enabled=false ;;
                on) jar=jars/comet-branch/comet.jar; enabled=true ;;
              esac
              echo "round $round variant $variant"
              BENCH_VARIANT="$variant" BENCH_ROUND="$round" \
              spark-submit --master 'local[4]' --driver-memory 8g \
                --jars "jars/iceberg.jar,$jar" \
                --conf "spark.driver.extraClassPath=$jar" \
                --conf "spark.executor.extraClassPath=$jar" \
                --conf spark.plugins=org.apache.spark.CometPlugin \
                --conf spark.shuffle.manager=org.apache.spark.sql.comet.execution.shuffle.CometShuffleManager \
                --conf spark.comet.exec.shuffle.enabled=true \
                --conf spark.memory.offHeap.enabled=true \
                --conf spark.memory.offHeap.size=6g \
                --conf spark.comet.scan.icebergNative.enabled=true \
                --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
                --conf spark.sql.catalog.bench=org.apache.iceberg.spark.SparkCatalog \
                --conf spark.sql.catalog.bench.type=hadoop \
                --conf "spark.sql.catalog.bench.warehouse=$WAREHOUSE" \
                --conf spark.sql.adaptive.enabled=false \
                --conf spark.sql.shuffle.partitions=4 \
                --conf spark.sql.iceberg.aggregate-push-down.enabled=false \
                --conf spark.ui.enabled=false \
                $(filters "$enabled") \
                benchmarks/iceberg-runtime-pruning/run_queries.py > "run-$round-$variant.log" 2>&1 \
                || { tail -100 "run-$round-$variant.log"; exit 1; }
            done
          done
      - name: Summarize
        if: always()
        run: |
          python3 benchmarks/iceberg-runtime-pruning/summarize.py results.jsonl > results.md
          cat environment.md results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iceberg-adaptive-benchmark
          path: |
            environment.md
            results.jsonl
            results.md
            generate.log
            run-*.log
