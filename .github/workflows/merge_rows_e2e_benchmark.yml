# Benchmark-branch only: MERGE INTO end to end on Iceberg, plain Spark against
# Comet main (hash-set cardinality state), the previous roaring revision and
# the current one, on one runner over identical tables.

name: MergeRows MERGE INTO Benchmark

on:
  push:
    branches:
      - bench/merge-rows-cardinality
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-rows-e2e-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-Clink-arg=-fuse-ld=bfd"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: amd64/rust
    strategy:
      matrix:
        side: [main, previous, pr]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select the commit to build
        id: commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin main archive/mergerows-roaring-cardinality-previous
          case "${{ matrix.side }}" in
            main) sha="$(git merge-base HEAD origin/main)" ;;
            previous) sha="$(git rev-parse origin/archive/mergerows-roaring-cardinality-previous)" ;;
            pr) sha="$(git rev-parse HEAD)" ;;
          esac
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - name: Build the release library and Spark 3.5 jar
        env:
          COMET_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          cd native && cargo build --release --locked && cd ..
          ./mvnw -B install -Prelease -DskipTests -Pspark-3.5
          mkdir -p dist
          echo "$COMET_COMMIT" > dist/comet-commit.txt
          for jar in spark/target/comet-spark-spark3.5_2.12-*.jar; do
            case "$jar" in
              *-sources.jar|*-tests.jar|*/original-*) ;;
              *) cp "$jar" dist/comet.jar ;;
            esac
          done
          test -s dist/comet.jar
      - uses: actions/upload-artifact@v7
        with:
          name: comet-${{ matrix.side }}
          path: dist

  benchmark:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BENCH_ROWS: '5000000'
      BENCH_ROUNDS: '3'
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          pattern: comet-*
          path: jars
      - name: Install Spark 3.5.9 and Iceberg 1.8.1
        run: |
          python3 -m pip install --user --break-system-packages pyspark==3.5.9
          curl -fsSL -o jars/iceberg.jar \
            https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.8.1/iceberg-spark-runtime-3.5_2.12-1.8.1.jar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Record the environment
        run: |
          {
            echo "## Environment"
            echo
            for side in main previous pr; do
              echo "- comet-$side: \`$(cat jars/comet-$side/comet-commit.txt)\`"
            done
            echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) vCPUs"
            echo "- memory: $(free -g | awk '/Mem:/ {print $2}') GiB"
            echo "- Spark 3.5.9 local[4], Iceberg 1.8.1, $BENCH_ROWS target rows, $BENCH_ROUNDS rounds"
            echo
          } > environment.md
      - name: Generate tables once with plain Spark
        run: |
          export WAREHOUSE="$RUNNER_TEMP/warehouse" BENCH_SNAPSHOTS="$RUNNER_TEMP/snapshots.json"
          spark-submit --master 'local[4]' --driver-memory 8g --jars jars/iceberg.jar \
            --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
            --conf spark.sql.catalog.bench=org.apache.iceberg.spark.SparkCatalog \
            --conf spark.sql.catalog.bench.type=hadoop \
            --conf "spark.sql.catalog.bench.warehouse=$WAREHOUSE" \
            --conf spark.ui.enabled=false \
            benchmarks/merge-rows-e2e/generate_data.py | tee generate.log
          { echo "## Tables"; echo; grep '^TABLE' generate.log | sed 's/^/- /'; echo; } >> environment.md
      - name: Run rounds in rotated variant order
        run: |
          export WAREHOUSE="$RUNNER_TEMP/warehouse" BENCH_SNAPSHOTS="$RUNNER_TEMP/snapshots.json"
          export BENCH_OUTPUT="$GITHUB_WORKSPACE/results.jsonl"
          common=(
            --master 'local[4]' --driver-memory 8g
            --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
            --conf spark.sql.catalog.bench=org.apache.iceberg.spark.SparkCatalog
            --conf spark.sql.catalog.bench.type=hadoop
            --conf "spark.sql.catalog.bench.warehouse=$WAREHOUSE"
            --conf spark.sql.shuffle.partitions=4
            --conf spark.ui.enabled=false
          )
          run() {
            variant=$1 offheap=$2; shift 2
            if [ "$variant" = spark ]; then
              extra=(--jars jars/iceberg.jar)
            else
              jar="jars/${variant}/comet.jar"
              extra=(
                --jars "jars/iceberg.jar,$jar"
                --conf "spark.driver.extraClassPath=$jar"
                --conf "spark.executor.extraClassPath=$jar"
                --conf spark.plugins=org.apache.spark.CometPlugin
                --conf spark.shuffle.manager=org.apache.spark.sql.comet.execution.shuffle.CometShuffleManager
                --conf spark.comet.exec.shuffle.enabled=true
                --conf spark.memory.offHeap.enabled=true
                --conf "spark.memory.offHeap.size=$offheap"
                --conf spark.comet.scan.icebergNative.enabled=true
                --conf spark.comet.exec.mergeRows.enabled=true
              )
            fi
            spark-submit "${common[@]}" "${extra[@]}" "$@" \
              benchmarks/merge-rows-e2e/run_merge.py > "run-$BENCH_VARIANT-$BENCH_ROUND.log" 2>&1 \
              || { tail -100 "run-$BENCH_VARIANT-$BENCH_ROUND.log"; exit 1; }
          }
          variants=(spark comet-main comet-previous comet-pr)
          for round in $(seq 0 $((BENCH_ROUNDS - 1))); do
            for offset in 0 1 2 3; do
              variant="${variants[$(((round + offset) % 4))]}"
              echo "round $round variant $variant"
              BENCH_VARIANT="$variant" BENCH_ROUND="$round" run "$variant" 6g
            done
          done
          # Tight native memory: does the cardinality state still fit?
          for size in 512m 256m; do
            for variant in comet-main comet-previous comet-pr; do
              echo "low memory $size variant $variant"
              BENCH_VARIANT="$variant-offheap-$size" BENCH_ROUND=0 \
                BENCH_CASES=mor_update_all,mor_update_all_64_files run "$variant" "$size"
            done
          done
      - name: Summarize
        if: always()
        run: |
          python3 benchmarks/merge-rows-e2e/summarize.py results.jsonl > results.md
          cat environment.md results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: merge-rows-e2e-benchmark
          path: |
            environment.md
            results.jsonl
            results.md
            generate.log
            run-*.log
