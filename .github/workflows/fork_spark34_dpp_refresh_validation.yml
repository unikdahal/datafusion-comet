name: Fork Spark 3.4 DPP refresh validation

on:
  push:
    branches: [fix/spark-3.4-aqe-dpp-shuffle-refresh]

permissions:
  contents: read

jobs:
  focused-spark-34:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - uses: ./.github/actions/java-test
        with:
          artifact_name: fork-spark34-dpp-refresh
          suites: |
            org.apache.comet.rules.CometExecRuleSuite
            org.apache.comet.exec.CometNativeShuffleSuite
            org.apache.comet.exec.CometExecSuite
          maven_opts: -Pspark-3.4
          upload-test-reports: 'true'
