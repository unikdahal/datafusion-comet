# Fork-only validation of adaptive native Iceberg pruning: Rust lint and tests,
# a release library, and the native Iceberg and broadcast transport suites on two Spark versions.

name: Fork Adaptive Iceberg Pruning Validation

on:
  push:
    branches: [feat/iceberg-adaptive-pruning, 'adaptive-ci/**']

permissions:
  contents: read

concurrency:
  group: fork-iceberg-adaptive-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-Clink-arg=-fuse-ld=bfd"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    if: github.repository == 'unikdahal/datafusion-comet'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - name: Record Rust formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd native && cargo fmt --all
          git -C "$GITHUB_WORKSPACE" diff -- native > "$GITHUB_WORKSPACE/rust-format.patch"
          git -C "$GITHUB_WORKSPACE" checkout -- native
      - uses: actions/upload-artifact@v7
        with:
          name: rust-format
          path: rust-format.patch
      - name: Require formatted Rust sources
        run: test ! -s rust-format.patch
      - name: Rust lint and tests
        uses: ./.github/actions/rust-test

  native:
    if: github.repository == 'unikdahal/datafusion-comet'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-runtime-registry-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: Linux-cargo-ci-
      - name: Build release library
        run: cd native && cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-release-library
          path: native/target/release/libcomet.so

  integration:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: amd64/rust
    strategy:
      fail-fast: false
      matrix:
        spark: ['3.5', '4.1']
    env:
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: runtime-release-library
          path: native/target/release
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: runtime-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: Linux-java-maven-
      - name: Record Scala formatting differences
        env:
          SPARK_PROFILE: ${{ matrix.spark }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./mvnw -B spotless:apply -Pspark-$SPARK_PROFILE
          # Keep the formatted sources so the suite still runs; fail at the end.
          git diff -- spark common > scala-format.patch
      - name: Native Iceberg and broadcast transport suites
        env:
          SPARK_PROFILE: ${{ matrix.spark }}
        run: |
          export SPARK_HOME="$GITHUB_WORKSPACE"
          ./mvnw -B -Prelease -Pspark-$SPARK_PROFILE test -Dtest=none \
            '-Dsuites=org.apache.comet.CometIcebergNativeSuite,org.apache.spark.sql.comet.util.UtilsSuite'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iceberg-adaptive-validation-spark-${{ matrix.spark }}
          path: |
            scala-format.patch
            **/target/surefire-reports/*
            **/target/unit-tests.log
      - name: Require formatted Scala sources
        run: test ! -s scala-format.patch
