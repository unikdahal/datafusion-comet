name: MergeRows review validation

on:
  push:
    branches:
      - merge-rows-review-executor

permissions:
  contents: write

jobs:
  patch-review:
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: merge-rows-review-candidate
          fetch-depth: 0

      - name: Apply planner and versioned-source review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add canonical https://github.com/apache/datafusion-comet.git
          git fetch canonical main

          python3 - <<'PY'
          from pathlib import Path

          planner = Path("native/core/src/execution/planner.rs")
          s = planner.read_text()

          if "let output_width = merge.output_types.len();" not in s:
              marker = "                let matched_instructions = compile_instructions(&merge.matched_instructions)?;"
              validation = '''                let output_width = merge.output_types.len();
                  let validate_instruction_shapes =
                      |group: &str, instructions: &[spark_operator::MergeInstruction]| {
                          for (instruction_index, instruction) in instructions.iter().enumerate() {
                              if instruction.outputs.len() > 2 {
                                  return Err(ExecutionError::GeneralError(format!(
                                      "MergeRows {group} instruction {instruction_index} has {} output rows; expected at most 2",
                                      instruction.outputs.len()
                                  )));
                              }
                              for (output_index, output) in instruction.outputs.iter().enumerate() {
                                  if output.exprs.len() != output_width {
                                      return Err(ExecutionError::GeneralError(format!(
                                          "MergeRows {group} instruction {instruction_index} output {output_index} has {} expressions; expected {output_width}",
                                          output.exprs.len()
                                      )));
                                  }
                              }
                          }
                          Ok(())
                      };
                  validate_instruction_shapes("matched", &merge.matched_instructions)?;
                  validate_instruction_shapes("not matched", &merge.not_matched_instructions)?;
                  validate_instruction_shapes(
                      "not matched by source",
                      &merge.not_matched_by_source_instructions,
                  )?;

          '''
              if marker not in s:
                  raise SystemExit("instruction compilation marker not found")
              s = s.replace(marker, validation + marker, 1)

          old_cast = "                    merge.row_id_ordinal.map(|ord| ord as usize),"
          if old_cast in s:
              marker = "                let exec = Arc::new(MergeRowsExec::try_new("
              ordinal = '''                let row_id_ordinal = match merge.row_id_ordinal {
                      Some(ordinal) if ordinal < 0 => {
                          return Err(ExecutionError::GeneralError(format!(
                              "MergeRows row_id_ordinal must be non-negative, got {ordinal}"
                          )));
                      }
                      Some(ordinal) => Some(ordinal as usize),
                      None => None,
                  };

          '''
              if marker not in s:
                  raise SystemExit("MergeRowsExec construction marker not found")
              s = s.replace(marker, ordinal + marker, 1)
              s = s.replace(old_cast, "                    row_id_ordinal,", 1)
          elif "let row_id_ordinal = match merge.row_id_ordinal" not in s:
              raise SystemExit("row_id_ordinal was neither original nor reviewed form")

          planner.write_text(s)

          license_header = '''/*
           * Licensed to the Apache Software Foundation (ASF) under one
           * or more contributor license agreements.  See the NOTICE file
           * distributed with this work for additional information
           * regarding copyright ownership.  The ASF licenses this file
           * to you under the Apache License, Version 2.0 (the
           * "License"); you may not use this file except in compliance
           * with the License.  You may obtain a copy of the License at
           *
           *   http://www.apache.org/licenses/LICENSE-2.0
           *
           * Unless required by applicable law or agreed to in writing,
           * software distributed under the License is distributed on an
           * "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY
           * KIND, either express or implied.  See the License for the
           * specific language governing permissions and limitations
           * under the License.
           */

          '''

          spark40 = Path("spark/src/main/spark-4.0/org/apache/comet/rules/shims/ShimCometMergeRows.scala")
          spark40.parent.mkdir(parents=True, exist_ok=True)
          spark40.write_text(license_header + '''package org.apache.comet.rules.shims

          import org.apache.spark.sql.execution.SparkPlan
          import org.apache.spark.sql.execution.datasources.v2.MergeRowsExec

          import org.apache.comet.serde.CometOperatorSerde
          import org.apache.comet.serde.operator.CometMergeRows

          /** Registers native `MergeRowsExec` for Spark 4.0. */
          object ShimCometMergeRows {
            val nativeExecs: Map[Class[_ <: SparkPlan], CometOperatorSerde[_]] =
              Map(classOf[MergeRowsExec] -> CometMergeRows)
          }
          ''')

          spark41plus = Path("spark/src/main/spark-4.1+/org/apache/comet/rules/shims/ShimCometMergeRows.scala")
          spark41plus.parent.mkdir(parents=True, exist_ok=True)
          spark41plus.write_text(license_header + '''package org.apache.comet.rules.shims

          import org.apache.spark.sql.execution.SparkPlan

          import org.apache.comet.serde.CometOperatorSerde

          /**
           * Spark 4.1+ keeps `MergeRowsExec` on the JVM so the existing-table write path can derive
           * and deliver the action summary expected by summary-aware commits.
           */
          object ShimCometMergeRows {
            val nativeExecs: Map[Class[_ <: SparkPlan], CometOperatorSerde[_]] = Map.empty
          }
          ''')

          broad = Path("spark/src/main/spark-4.x/org/apache/comet/rules/shims/ShimCometMergeRows.scala")
          if broad.exists():
              broad.unlink()
          PY

      - name: Apply and verify formatting
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -Pspark-3.4,scala-2.12 -DskipTests spotless:apply
          ./mvnw -B -Pspark-3.5,scala-2.13 -DskipTests spotless:apply
          ./mvnw -B -Pspark-4.0 -DskipTests spotless:apply
          ./mvnw -B -Pspark-4.1 -DskipTests spotless:apply
          ./mvnw -B -Pspark-4.2 -DskipTests spotless:apply
          ./mvnw -B -Pspark-3.4,scala-2.12 -DskipTests spotless:check
          ./mvnw -B -Pspark-3.5,scala-2.13 -DskipTests spotless:check
          ./mvnw -B -Pspark-4.0 -DskipTests spotless:check
          ./mvnw -B -Pspark-4.1 -DskipTests spotless:check
          ./mvnw -B -Pspark-4.2 -DskipTests spotless:check
          (cd native && cargo fmt --all && cargo fmt --all -- --check)
          git diff --check

      - name: Verify feature diff is self-contained
        shell: bash
        run: |
          set -euo pipefail
          if git diff canonical/main -- | grep -E 'SPARK-[0-9]+|#[0-9]{2,}|/pull/[0-9]+|/issues/[0-9]+'; then
            echo "External issue or pull-request identifier found in feature diff"
            exit 1
          fi

      - name: Commit reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Reviewed candidate already contains all fixes"
          else
            git commit -m "fix: harden MergeRows planning and versioned source layout"
            git push origin HEAD:merge-rows-review-candidate
          fi

  native-test:
    needs: patch-review
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: merge-rows-review-candidate
      - name: Set up builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: 17
      - name: Run MergeRows native tests
        shell: bash
        run: |
          set -euo pipefail
          cd native
          cargo test -p datafusion-comet merge_rows --lib
      - name: Build release native library
        shell: bash
        run: |
          set -euo pipefail
          cd native
          cargo build --release
      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: merge-rows-native-lib
          path: native/target/release/libcomet.so
          retention-days: 1

  spark-test:
    needs: native-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: spark-3.4
            java: '11'
            opts: '-Pspark-3.4 -Pscala-2.12'
          - name: spark-3.5
            java: '17'
            opts: '-Pspark-3.5 -Pscala-2.13'
          - name: spark-4.0
            java: '21'
            opts: '-Pspark-4.0'
          - name: spark-4.1
            java: '17'
            opts: '-Pspark-4.1'
          - name: spark-4.2
            java: '17'
            opts: '-Pspark-4.2'
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
      env:
        JAVA_TOOL_OPTIONS: ${{ (matrix.java == '17' || matrix.java == '21') && '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: merge-rows-review-candidate
      - name: Set up builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: ${{ matrix.java }}
      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: merge-rows-native-lib
          path: native/target/release/
      - name: Run version-specific MergeRows suite
        uses: ./.github/actions/java-test
        with:
          artifact_name: merge-rows-${{ matrix.name }}
          suites: org.apache.comet.exec.CometMergeRowsSuite
          maven_opts: ${{ matrix.opts }}
          upload-test-reports: true
          skip-native-build: true
