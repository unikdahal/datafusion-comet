# Fork-only TopK live-pruning correctness and reader I/O checks.

name: Fork Iceberg TopK Validation

on:
  push:
    branches: [feat/iceberg-topk-runtime-filter]
    # Unit-test/import and description fixes use ordinary CI. Dispatch this
    # release integration workflow after an unchanged native artifact finishes.
    paths-ignore:
      - native/core/src/execution/operators/dynamic_filter/topk/tests/**
      - spark/src/main/scala/org/apache/comet/CometConf.scala
      - dev/ci/reuse-iceberg-runtime-library.py
      - .github/workflows/iceberg_topk_validation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-iceberg-topk-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-Clink-arg=-fuse-ld=bfd"
  RUST_BACKTRACE: "1"

jobs:
  native:
    if: github.repository == 'unikdahal/datafusion-comet'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fork-runtime-registry-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: Linux-cargo-ci-
      - name: Format Rust
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd native && cargo fmt --all
      - name: Find a release library with identical native sources
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev/ci/reuse-iceberg-runtime-library.py
      - uses: actions/download-artifact@v8
        if: steps.reuse.outputs.artifact_id != ''
        with:
          artifact-ids: ${{ steps.reuse.outputs.artifact_id }}
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
          path: native/target/release
      - name: Build release library
        if: steps.reuse.outputs.artifact_id == ''
        run: cd native && cargo build --release --locked
      - name: Export formatting patch
        if: always()
        continue-on-error: true
        run: git -C "$GITHUB_WORKSPACE" diff -- native > rust-format.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-rust-format
          path: rust-format.patch
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-release-library
          path: native/target/release/libcomet.so
  integration:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: amd64/rust
    strategy:
      fail-fast: false
      matrix:
        spark: ['3.5', '4.1']
    env:
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
      COMET_ICEBERG_BENCHMARK_REPEATS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: runtime-release-library
          path: native/target/release
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: runtime-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: Linux-java-maven-
      - name: Format Scala
        env:
          SPARK_PROFILE: ${{ matrix.spark }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./mvnw -B spotless:apply -Pspark-$SPARK_PROFILE
          git diff -- spark > scala-format.patch
      - name: Spark TopK correctness and live reader pruning
        env:
          SPARK_PROFILE: ${{ matrix.spark }}
        run: |
          export SPARK_HOME="$GITHUB_WORKSPACE"
          ./mvnw -B -Prelease -Pspark-$SPARK_PROFILE test -Dtest=none \
            '-Dsuites=org.apache.comet.CometIcebergNativeSuite TopK live thresholds prune unread native Iceberg row groups'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iceberg-topk-validation-spark-${{ matrix.spark }}
          path: |
            scala-format.patch
            **/target/surefire-reports/*
            **/target/unit-tests.log
